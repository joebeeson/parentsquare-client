[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "parentsquare-client"
version = "0.2.4"
description = "Unofficial read-only sync and async ParentSquare client"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Joe Beeson" }]
keywords = ["parentsquare", "school", "calendar", "client"]
dependencies = [
  "aiohttp>=3.10,<4",
  "beautifulsoup4>=4.12,<5",
  "icalendar>=6,<7",
]

[project.optional-dependencies]
keyring = ["keyring>=25,<26"]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "pytest-datadir>=1,<2",
  "pytest-asyncio>=1,<2",
  "pyrefly>=1.4,<2",
  "ruff>=0.8,<1",
  "keyring>=25,<26",
]

[project.urls]
Homepage = "https://github.com/joebeeson/parentsquare-client"
Repository = "https://github.com/joebeeson/parentsquare-client"
Issues = "https://github.com/joebeeson/parentsquare-client/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/parentsquare"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyrefly]
project-includes = [
    "src/**/*.py",
]
